{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Skillify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login_registration.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/dark-mode.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <script>(function(){try{var t=localStorage.getItem('skillify-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="position:fixed;bottom:20px;right:20px;z-index:999;width:45px;height:45px;border-radius:50%;border:none;background:#667eea;color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.2);transition:all 0.3s;"><i class="bi bi-moon-stars-fill"></i></button>
    <div class="auth-container">
        <div class="container-fluid h-100">
            <div class="row h-100 justify-content-center align-items-center">
                <div class="col-lg-5">
                    <div class="auth-form-container">
                        <div class="auth-header text-center">
                            <div style="font-size: 3rem; color: #4ECDC4; margin-bottom: 1rem;">
                                <i class="bi bi-envelope-check"></i>
                            </div>
                            <h2>Verify Your Email</h2>
                            <p>We've sent a 6-digit OTP to <strong>{{ email }}</strong></p>
                        </div>

                        <form method="POST" action="{% url 'verify_otp' %}" class="auth-form">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="otp" class="form-label">
                                    <i class="bi bi-key"></i> Enter OTP
                                </label>
                                <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp"
                                       placeholder="000000" maxlength="6" pattern="[0-9]{6}" required
                                       style="font-size: 1.5rem; letter-spacing: 0.5rem;">
                                <small class="form-text">OTP expires in 5 minutes</small>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block mt-3" data-loading-text="Verifying...">
                                <i class="bi bi-check-circle"></i> Verify OTP
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="text-muted">Didn't receive the code?</p>
                            <a href="{% url 'resend_otp' %}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-clockwise"></i> Resend OTP
                            </a>
                        </div>

                        <div class="text-center mt-4">
                            <a href="{% url 'register' %}" class="back-link">
                                <i class="bi bi-arrow-left"></i> Back to Register
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% include "core/chatbot_widget.html" %}
    <script src="{% static 'js/dark-mode.js' %}" defer></script>
    <script src="{% static 'js/form-loaders.js' %}" defer></script>
<script src="{% static 'js/message-badge.js' %}" defer></script>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:10000;">
        {% for message in messages %}
        <div class="toast skillify-toast align-items-center text-white border-0 show mb-2"
             role="alert" data-bs-autohide="true" data-bs-delay="4500"
             data-bg="{{ message.tags }}">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' or message.tags == 'danger' %}x-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}" style="font-size:1.1rem;flex-shrink:0;"></i>
                    <span>{{ message }}</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
        {% endfor %}
    </div>
    <button id="backToTop" class="back-to-top-btn" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.skillify-toast').forEach(function(el) {
            new bootstrap.Toast(el, { autohide: true, delay: 4500 }).show();
        });
        var b = document.getElementById('backToTop');
        if (b) {
            window.addEventListener('scroll', function() { b.classList.toggle('visible', window.scrollY > 500); });
            b.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        }
    });
    </script>
</body>
</html>
